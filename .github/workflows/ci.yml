name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify (format, compile, tests, coverage gate, jar)
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: simulate-transfer (end-to-end on a disposable database)
        shell: bash
        run: python scripts/simulate_transfer.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore

  repository-checks:
    name: Brain, skills, ADRs and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skills
        run: python3 scripts/validate_skills.py

      - name: Validate second brain
        run: python3 scripts/validate_brain.py

      - name: Validate ADRs
        run: python3 scripts/validate_adrs.py

      - name: Lint scripts
        run: |
          python -m pip install --upgrade pip flake8
          flake8 scripts/ --max-line-length=120 --ignore=E501,W503

      - name: No floating point in domain or application code
        run: |
          if grep -rEn '\b(float|double|Float|Double)\b' \
              src/main/java/org/ledgerapi/domain src/main/java/org/ledgerapi/application; then
            echo "Floating-point types are not allowed in money-handling layers (DC-5, BR-1)."
            exit 1
          fi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
